name: Publish Docker image to GHCR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v2026.03_1)"
        required: true
      koreader_version:
        description: "KOReader version tag"
        required: true
        default: "v2026.03"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Parse KOReader version from tag: v2026.03_2 → v2026.03
          KOREADER_VER=$(echo "$TAG" | sed 's/^v\([0-9]*\.[0-9]*\).*/v\1/')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "koreader_version=$KOREADER_VER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          build-args: |
            KOREADER_VERSION=${{ steps.tag.outputs.koreader_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
